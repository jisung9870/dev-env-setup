<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Workbench dashboard desktop wireframe</title>
  <desc id="desc">A desktop dashboard showing projects, active AI agents, worktrees, changes, capabilities and actions shared across cmux, Windows Terminal and standard browsers.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity=".5"/>
    </filter>
    <style>
      .brand{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .h1{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f8fafc}
      .h2{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f1f5f9}
      .body{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#cbd5e1}
      .small{font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#94a3b8}
      .mono{font:500 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8}
      .card{fill:#141d2e;stroke:#2a3952;stroke-width:1.5}
      .row{fill:#182338;stroke:#2a3952;stroke-width:1}
      .rule{stroke:#26344a;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#070b14"/>
  <rect x="35" y="35" width="1530" height="930" rx="24" fill="url(#page)" stroke="#334155" filter="url(#shadow)"/>

